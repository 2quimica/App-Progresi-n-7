<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Progresión 7: Gravitación Universal y Ley de Coulomb</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: #131b2e;
      --bg-card-hover: #1c2742;
      --border-color: #263554;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #06b6d4;
      --accent-cyan-glow: rgba(6, 182, 212, 0.25);
      --accent-purple: #8b5cf6;
      --accent-purple-glow: rgba(139, 92, 246, 0.25);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.2);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-stack);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Fixed top navigation bar */
    .top-bar {
      position: sticky;
      top: 8px;
      z-index: 100;
      background: rgba(19, 27, 46, 0.94);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .top-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-cyan);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .phase-badge {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .progress-bar-track {
      width: 100%;
      height: 8px;
      background-color: #0b111e;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
      transition: width 0.4s ease;
    }

    /* Standard Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-header-badge {
      align-self: flex-start;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan-glow);
    }

    h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.25;
      background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--accent-cyan);
    }

    h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    strong {
      color: var(--text-main);
    }

    /* Teacher Pause Box */
    .teacher-pause-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.12), rgba(139, 92, 246, 0.12));
      border: 2px dashed var(--accent-amber);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .teacher-pause-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent-amber);
    }

    /* Form Inputs & Buttons */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .input-control {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-control:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 0 3px var(--accent-cyan-glow);
    }

    .btn {
      width: 100%;
      min-height: 50px;
      padding: 12px 20px;
      border-radius: 12px;
      border: none;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      user-select: none;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent-cyan), #0284c7);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-cyan-glow);
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #18233c;
      color: var(--text-main);
      border: 1.5px solid var(--border-color);
    }

    .btn-secondary:hover {
      background-color: var(--bg-card-hover);
      border-color: var(--accent-cyan);
    }

    .btn-amber {
      background: linear-gradient(135deg, var(--accent-amber), #d97706);
      color: #ffffff;
      box-shadow: 0 4px 14px var(--accent-amber-glow);
    }

    .btn-disabled {
      opacity: 0.5;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* Interactive Simulations Layout */
    .sim-container {
      background-color: #0b101d;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .sim-canvas-box {
      width: 100%;
      min-height: 180px;
      background-color: #060911;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 480px) {
      .controls-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .slider-control {
      display: flex;
      flex-direction: column;
      gap: 4px;
      background: #131a2a;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .slider-control label {
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      color: var(--accent-cyan);
    }

    .slider-control input[type="range"] {
      width: 100%;
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .value-display {
      font-weight: 800;
      color: var(--text-main);
    }

    .formula-banner {
      background-color: #172238;
      border-left: 4px solid var(--accent-cyan);
      padding: 12px 14px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.95rem;
      color: #38bdf8;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Option & Answer Cards */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1.5px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-main);
      font-size: 0.92rem;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .option-btn:hover:not(.btn-disabled) {
      border-color: var(--accent-cyan);
      background-color: var(--bg-card-hover);
    }

    .option-btn.selected {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.12);
    }

    .option-letter {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background-color: var(--border-color);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .feedback-box {
      border-radius: 12px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.9rem;
    }

    .feedback-correct {
      background-color: var(--success-bg);
      border: 1.5px solid var(--success);
      color: #6ee7b7;
    }

    .feedback-incorrect {
      background-color: var(--danger-bg);
      border: 1.5px solid var(--danger);
      color: #fca5a5;
    }

    /* Touch Categorizer (Elaborate) */
    .categorizer-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .category-columns {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 520px) {
      .category-columns {
        grid-template-columns: 1fr 1fr 1fr;
      }
    }

    .category-box {
      background-color: #0b101d;
      border: 1.5px dashed var(--border-color);
      border-radius: 12px;
      padding: 10px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: border-color 0.2s;
    }

    .category-box.active-target {
      border-color: var(--accent-cyan);
      background-color: rgba(6, 182, 212, 0.05);
    }

    .category-title {
      font-size: 0.8rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      color: var(--accent-cyan);
    }

    .items-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px;
      background-color: #0b101d;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .chip-item {
      padding: 8px 12px;
      border-radius: 20px;
      background-color: #1a253e;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip-item.selected-chip {
      border-color: var(--accent-cyan);
      background-color: var(--accent-cyan);
      color: #000;
      font-weight: 800;
    }

    /* Concept Map */
    .concept-map-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .map-nodes-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 480px) {
      .map-nodes-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .map-node {
      background-color: #0b101d;
      border: 1.5px solid var(--border-color);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .map-node-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
    }

    .map-slot {
      min-height: 40px;
      border: 1.5px dashed var(--accent-cyan);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-cyan);
      cursor: pointer;
      background-color: rgba(6, 182, 212, 0.04);
    }

    .map-slot.filled {
      border-style: solid;
      background-color: #1e2c4a;
      color: #fff;
    }

    /* Quiz Grid Indicator */
    .quiz-nav-grid {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      margin: 8px 0;
    }

    .quiz-nav-btn {
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: #0b101d;
      color: var(--text-muted);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .quiz-nav-btn.active {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
      box-shadow: 0 0 0 2px var(--accent-cyan-glow);
    }

    .quiz-nav-btn.answered {
      background-color: #1e2c4a;
      color: #fff;
      border-color: var(--accent-purple);
    }

    /* Evidence Screenshot Card */
    .evidence-card {
      background: linear-gradient(180deg, #131b2e 0%, #080d1a 100%);
      border: 2px solid var(--accent-cyan);
      border-radius: 20px;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 0 30px rgba(6, 182, 212, 0.25);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .score-large {
      font-size: 3.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge-perf {
      display: inline-block;
      padding: 6px 18px;
      border-radius: 20px;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      align-self: center;
    }

    .badge-exc { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
    .badge-good { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid #06b6d4; }
    .badge-proc { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }
    .badge-reinf { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid #ef4444; }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.88rem;
      text-align: left;
    }

    .summary-table td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border-color);
    }

    .summary-table td:nth-child(2) {
      text-align: right;
      font-weight: 700;
      color: var(--text-main);
    }

    .camera-notice {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
      border: 1.5px dashed var(--accent-amber);
      border-radius: 12px;
      padding: 12px;
      font-size: 0.88rem;
      font-weight: 800;
      color: #fef08a;
    }

    /* Custom SVG Orbit / Diagram styling */
    svg text {
      user-select: none;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Top Progress Bar (Visible after Start) -->
    <div id="top-bar" class="top-bar" style="display: none;">
      <div class="top-bar-header">
        <span id="user-display-tag" class="user-tag">Estudiante</span>
        <span id="phase-display-badge" class="phase-badge">FASE 1 DE 5</span>
      </div>
      <div class="progress-bar-track">
        <div id="progress-bar-fill" class="progress-bar-fill"></div>
      </div>
    </div>

    <!-- Main Dynamic Content Container -->
    <main id="app-content"></main>
  </div>

  <script>
    // --- GLOBAL CONSTANTS & BANK DATA ---

    // Quiz Questions Bank (10 Questions mapped exactly to requirements)
    const QUIZ_BANK = [
      {
        id: 1,
        topic: "gravitacion",
        question: "¿Qué establece formalmente la Ley de Gravitación Universal enunciada por Isaac Newton?",
        options: [
          "Que dos masas se repelen proporcionalmente al cuadrado de la distancia que las separa.",
          "Que la fuerza gravitatoria entre dos masas es directamente proporcional al producto de sus masas e inversamente proporcional al cuadrado de la distancia entre ellas.",
          "Que la fuerza gravitatoria actúa únicamente en presencia de una atmósfera densa.",
          "Que la fuerza entre objetos distantes depende exclusivamente de la constante de Coulomb k."
        ],
        correct: 1,
        explanation: "Newton demostró que toda masa atrae a otra masa con una fuerza proporcional al producto de ambas ($m_1 \\cdot m_2$) y que disminuye rápidamente con el cuadrado de la distancia ($1/r^2$)."
      },
      {
        id: 2,
        topic: "gravitacion",
        question: "Si la distancia entre dos cuerpos celestes se reduce a la mitad (r / 2), ¿qué ocurre con la magnitud de la fuerza gravitatoria entre ellos?",
        options: [
          "Se reduce a la mitad (F / 2).",
          "Permanece exactamente constante.",
          "Aumenta al cuádruple (4F).",
          "Se duplica únicamente (2F)."
        ],
        correct: 2,
        explanation: "Debido a la relación inversamente proporcional al cuadrado ($1/r^2$), si r se reduce a la mitad, $(1/2)^2 = 1/4$ en el denominador, lo que quintuplica o multiplica por 4 la fuerza ($4F$)."
      },
      {
        id: 3,
        topic: "masa_peso",
        question: "¿Cuál de las siguientes afirmaciones sobre la MASA y el PESO es científicamente CORRECTA?",
        options: [
          "La masa cambia según el planeta, mientras que el peso permanece idéntico en todo el universo.",
          "La masa es la cantidad de materia (en kg) y es invariable; el peso es la fuerza gravitatoria (en N) y depende del valor local de g.",
          "Masa y peso son sinónimos idénticos y ambos se miden siempre en kilogramos en el Sistema Internacional.",
          "El peso de una persona en la Luna es mayor que en la Tierra porque la aceleración de la gravedad es mayor allá."
        ],
        correct: 1,
        explanation: "La masa ($m$) es una propiedad intrínseca de la materia. El peso ($P=m \\cdot g$) es la fuerza gravitatoria con la que el astro jala esa masa, por lo que varía si cambia $g$."
      },
      {
        id: 4,
        topic: "distancia_cuadrado",
        question: "Si duplicamos la distancia entre dos objetos cargados eléctricamente, ¿cómo se modifica la fuerza de Coulomb entre ellos?",
        options: [
          "Disminuye a la cuarta parte (F / 4).",
          "Disminuye exactamente a la mitad (F / 2).",
          "Se duplica (2F).",
          "Aumenta al cuádruple (4F)."
        ],
        correct: 0,
        explanation: "Tanto la ley de gravitación como la ley de Coulomb obedecen la ley del inverso del cuadrado. Si la distancia se duplica ($2r$), la fuerza resulta dividida entre $2^2 = 4$."
      },
      {
        id: 5,
        topic: "coulomb",
        question: "¿Qué expresa la Ley de Coulomb para la fuerza electrostática entre dos cargas puntuales?",
        options: [
          "La fuerza eléctrica es inversamente proporcional al producto de las cargas y directa a la distancia.",
          "La fuerza es proporcional al producto de las magnitudes de las cargas e inversamente proporcional al cuadrado de la distancia entre ellas.",
          "Las cargas del mismo signo siempre se atraen con una constante $G$.",
          "La fuerza es nula si los cuerpos están separados por el vacío."
        ],
        correct: 1,
        explanation: "La Ley de Coulomb es $F_e = k \\frac{|q_1 q_2|}{r^2}$. La magnitud depende directamente del producto de las cargas y del inverso del cuadrado de la distancia."
      },
      {
        id: 6,
        topic: "coulomb",
        question: "Al comparar dos cargas eléctricas del mismo signo (- y -), ¿cuál es el comportamiento de la fuerza eléctrica entre ellas?",
        options: [
          "Se atraen mutuamente.",
          "Se repelen mutuamente.",
          "No ejercen ninguna fuerza por ser negativas.",
          "La fuerza se vuelve estrictamente gravitacional."
        ],
        correct: 1,
        explanation: "Cargas del mismo signo (positivas con positivas, o negativas con negativas) experimentan fuerza de repulsión. Cargas de signos opuestos se atraen."
      },
      {
        id: 7,
        topic: "atraccion_repulsion",
        question: "¿Por qué la interacción gravitatoria es SIEMPRE de atracción, mientras que la interacción electrostática puede ser de atracción o repulsión?",
        options: [
          "Porque la constante G es muy grande y la constante k es muy pequeña.",
          "Porque existe un solo tipo de masa (siempre positiva), mientras que existen dos tipos de carga eléctrica (positiva y negativa).",
          "Porque la gravedad no posee naturaleza vectorial.",
          "Porque los electrones no tienen masa."
        ],
        correct: 1,
        explanation: "Dado que la masa gravitacional solo tiene valores positivos, la gravedad únicamente atrae. Las cargas eléctricas existen en dos variedades ($+$ y $-$), permitiendo atracción (signos opuestos) y repulsión (mismo signo)."
      },
      {
        id: 8,
        topic: "vectorial",
        question: "En una línea recta, si una carga negativa $q$ está situada entre dos cargas positivas idénticas situadas a la misma distancia a su izquierda y derecha, ¿cuál es la fuerza nulta sobre $q$?",
        options: [
          "Cero (0 N), porque las dos fuerzas de atracción tienen igual magnitud y sentidos opuestos.",

      try {

        topBar.style.display = 'flex';
        userTag.textContent = `${state.user.name} (${state.user.group})`;
        phaseBadge.textContent = `FASE ${state.phase} DE 5`;
        const percent = Math.min(100, Math.max(5, (state.phase / 5) * 100));
        progressFill.style.width = `${percent}%`;
      }

      // Route to correct screen view
      switch (state.screen) {
        case 'START':
          renderStartScreen(container);
          break;
        case 'ENGAGE':
          renderEngageScreen(container);
          break;
        case 'EXPLORE':
          renderExploreScreen(container);
          break;
        case 'EXPLAIN':
          renderExplainScreen(container);
          break;
        case 'ELABORATE':
          renderElaborateScreen(container);
          break;
        case 'EVALUATE':
          renderEvaluateScreen(container);
          break;
        case 'EVIDENCE':
          renderEvidenceScreen(container);

          <!-- Question Body -->
          <div style="background: #0b101d; padding: 16px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 14px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="font-size: 0.8rem; font-weight: 800; color: var(--accent-cyan);">PREGUNTA ${currentIdx + 1} DE 10</span>
              <span style="font-size: 0.78rem; color: var(--text-muted);">${q.topic.toUpperCase()}</span>
            </div>

            <p style="font-weight: 700; color: var(--text-main); font-size: 1rem; line-height: 1.4;">
              ${q.question}
            </p>

            <div class="options-stack">
              ${q.options.map((opt, i) => {
                const isSelected = quiz.answers[currentIdx] === i;
                const letters = ["A", "B", "C", "D"];
                return `
                  <button class="option-btn ${isSelected ? 'selected' : ''}" onclick="selectQuizAnswer(${i})">
                    <span class="option-letter">${letters[i]}</span>
                    <span>${opt}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Nav Controls -->
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-secondary" style="flex: 1;" ${currentIdx === 0 ? 'disabled' : ''} onclick="navQuizTo(${currentIdx - 1})">
              ⬅️ ANTERIOR
            </button>
            <button class="btn btn-secondary" style="flex: 1;" ${currentIdx === 9 ? 'disabled' : ''} onclick="navQuizTo(${currentIdx + 1})">
              SIGUIENTE ➡️
            </button>
          </div>

          <!-- Submit Button -->
          <div style="margin-top: 8px;">
            ${renderSubmitQuizButton()}
          </div>
        </div>
      `;
    }

    function navQuizTo(idx) {
      state.evaluate.currentQ = idx;
      saveState();
      renderApp();
    }

    function selectQuizAnswer(optIdx) {
      state.evaluate.answers[state.evaluate.currentQ] = optIdx;
      saveState();
      renderApp();
    }

    function renderSubmitQuizButton() {
      const answeredCount = state.evaluate.answers.filter(a => a !== null).length;
      if (answeredCount < 10) {
        return `
          <div style="text-align: center; font-size: 0.85rem; color: var(--accent-amber); margin-bottom: 6px;">
            ⚠️ Has respondido ${answeredCount} de 10 preguntas. Completa todas para finalizar.
          </div>
          <button class="btn btn-disabled">🏁 FINALIZAR EVALUACIÓN</button>
        `;
      }
      return `
        <button class="btn btn-primary" onclick="submitQuiz()">
          🏁 FINALIZAR Y GENERAR EVIDENCIA
        </button>
      `;
    }

    function submitQuiz() {
      state.evaluate.submitted = true;
      state.screen = 'EVIDENCE';
      saveState();
      renderApp();
    }

    // --- SCREEN 6: EVIDENCE & RESULTS CARD ---
    function renderEvidenceScreen(container) {
      // Calculate Score
      let correct = 0;
      QUIZ_BANK.forEach((q, idx) => {
        if (state.evaluate.answers[idx] === q.correct) correct++;
      });
      const pct = Math.round((correct / 10) * 100);

      // Performance Badge
      let perfText = "";
      let perfClass = "";
      if (pct >= 90) { perfText = "EXCELENTE"; perfClass = "badge-exc"; }
      else if (pct >= 80) { perfText = "MUY BUEN DOMINIO"; perfClass = "badge-good"; }
      else if (pct >= 70) { perfText = "BUEN DOMINIO"; perfClass = "badge-good"; }
      else if (pct >= 60) { perfText = "EN PROCESO"; perfClass = "badge-proc"; }
      else { perfText = "REQUIERE REFORZAMIENTO"; perfClass = "badge-reinf"; }

      const now = new Date();
      const dateStr = now.toLocaleDateString('es-MX', { year: 'numeric', month: '2-digit', day: '2-digit' });
      const timeStr = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

      container.innerHTML = `
        <div class="evidence-card">
          <span class="card-header-badge" style="align-self: center;">EVIDENCIA DE EVALUACIÓN OFICIAL</span>
          <h2 style="color: #fff; font-size: 1.1rem; margin-bottom: 2px;">LA ENERGÍA EN LOS PROCESOS DE LA VIDA DIARIA</h2>
          <p style="color: var(--accent-cyan); font-weight: 700; font-size: 0.85rem;">PROGRESIÓN 7: GRAVITACIÓN UNIVERSAL Y LEY DE COULOMB</p>

          <div style="background-color: #0b101d; border-radius: 12px; padding: 12px;">
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--text-main);">${state.user.name}</div>
            <div style="font-size: 0.9rem; font-weight: 700; color: var(--accent-cyan);">GRUPO: ${state.user.group}</div>
          </div>

          <div class="score-large">${pct}%</div>
          <div style="font-weight: 800; font-size: 1.1rem; color: var(--text-main);">
            ${correct} / 10 ACIERTOS
          </div>

          <div class="badge-perf ${perfClass}">
            ${perfText}
          </div>

          <table class="summary-table">
            <tr><td>Estudiante:</td><td>${state.user.name}</td></tr>
            <tr><td>Grupo:</td><td>${state.user.group}</td></tr>
            <tr><td>Reactivos Correctos:</td><td>${correct} de 10</td></tr>
            <tr><td>Porcentaje Obtenido:</td><td>${pct}%</td></tr>
            <tr><td>Fecha y Hora:</td><td>${dateStr} - ${timeStr}</td></tr>
            <tr><td>Estatus:</td><td>✅ EVALUACIÓN COMPLETADA</td></tr>
          </table>

          <!-- Metacognitive Reflection Area -->
          <div style="background-color: #0b101d; border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; text-align: left;">
            <label style="font-size: 0.8rem; font-weight: 700; color: var(--accent-cyan); text-transform: uppercase;">🧠 Mi Reflexión Escrita:</label>
            <p style="font-size: 0.85rem; margin-top: 4px; color: var(--text-muted);">En tus propias palabras: ¿Qué semejanza y qué diferencia fundamental encuentras entre la Ley de Gravitación y la Ley of Coulomb?</p>
            <textarea id="reflection-text" class="input-control" rows="3" style="margin-top: 6px; font-size: 0.88rem;" placeholder="Escribe aquí tu reflexión final para tu profesor..." onchange="saveReflection(this.value)">${state.evaluate.reflection}</textarea>
          </div>

          <div class="camera-notice">
            📸 TOMA UNA CAPTURA DE ESTA PANTALLA Y ENVÍALA A TU PROFESOR COMO EVIDENCIA.
          </div>

          <!-- Review Answers Collapsible -->
          <div style="margin-top: 8px;">
            <button class="btn btn-secondary" onclick="toggleAnswerReview()">
              🔍 REVISAR RETROALIMENTACIÓN DE LAS 10 PREGUNTAS
            </button>
            <div id="answers-review-box" style="display: none; flex-direction: column; gap: 10px; margin-top: 12px; text-align: left;">
              ${QUIZ_BANK.map((q, idx) => {
                const userAns = state.evaluate.answers[idx];
                const isCorr = userAns === q.correct;
                return `
                  <div style="background: #0b101d; border: 1px solid ${isCorr ? 'var(--success)' : 'var(--danger)'}; border-radius: 10px; padding: 10px; font-size: 0.85rem;">
                    <div style="font-weight: 700; color: #fff;">${idx + 1}. ${q.question}</div>
                    <div style="color: ${isCorr ? '#6ee7b7' : '#fca5a5'}; margin-top: 4px;">
                      Tu respuesta: ${q.options[userAns]} ${isCorr ? '✅' : '❌'}
                    </div>
                    ${!isCorr ? `<div style="color: #38bdf8; font-weight: 600;">Respuesta correcta: ${q.options[q.correct]}</div>` : ''}
                    <div style="color: var(--text-muted); margin-top: 4px; font-size: 0.8rem;"><strong>Explicación:</strong> ${q.explanation}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <button class="btn btn-secondary" style="margin-top: 12px;" onclick="resetQuizSession()">
            🔄 Reiniciar evaluación para otro estudiante
          </button>
        </div>
      `;
    }

    function saveReflection(val) {
      state.evaluate.reflection = val;
      saveState();
    }

    function toggleAnswerReview() {
      const box = document.getElementById('answers-review-box');
      if (box) {
        box.style.display = box.style.display === 'none' ? 'flex' : 'none';
      }
    }

    function resetQuizSession() {
      if (confirm("¿Deseas reiniciar la aplicación para otro estudiante?")) {
        try {
          localStorage.removeItem(STORAGE_KEY);
        } catch(e) {}
        state.user = { name: '', group: '' };
        state.phase = 0;
        state.screen = 'START';
        state.evaluate.answers = new Array(10).fill(null);
        state.evaluate.submitted = false;
        renderApp();
      }
    }

    // Navigation Helper
    function goToPhase(phaseNum, screenName) {
      state.phase = phaseNum;
      state.screen = screenName;
      saveState();
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // --- INITIALIZATION ---
    window.onload = function() {
      loadState();
      renderApp();
    };
  </script>
</body>
</html>
